global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    default_backend app_backend

backend app_backend
    option httpchk GET /health
    http-check expect status 200

    server app app:8080 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
